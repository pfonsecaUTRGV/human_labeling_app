<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>MCIF Login</title>
</head>

<body>

    <h1>MCIF Human Annotation</h1>

    <h2>Login</h2>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Login
        </button>

    </form>

    <p style="text-align:center; margin-top:20px;">
    Don't have an account?

    <a href="{% url 'signup' %}">
        Create one
    </a>
</p>

</body>

</html>
