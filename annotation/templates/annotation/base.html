<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        MCIF Human Labeling
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background-color: #f5f6f8;
        }

        .navbar-brand {
            font-weight: 600;
        }

        .main-content {
            padding-top: 20px;
            padding-bottom: 40px;
        }
    </style>

    {% block extra_css %}
    {% endblock %}
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">

        <a
            class="navbar-brand"
            href="/"
        >
            MCIF Labeling
        </a>

        <div class="navbar-nav">

            <a
                class="nav-link"
                href="/"
            >
                Home
            </a>

            <a
                class="nav-link"
                href="/vlm-review/"
            >
                VLM Claim Review
            </a>

        </div>

        <div class="ms-auto text-white">

            {% if user.is_authenticated %}

                {{ user.username }}

            {% endif %}

        </div>

    </div>
</nav>


<div class="main-content">

    {% block content %}
    {% endblock %}

</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>

{% block extra_js %}
{% endblock %}

</body>
</html>
